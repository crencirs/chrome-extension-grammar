<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Gemini AI 번역 & 검토기 설정</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-area">
        <span class="logo-icon">✨</span>
        <div>
          <h1>Gemini AI 번역 & 문장 검토기</h1>
          <p class="subtitle">확장 프로그램 환경설정</p>
        </div>
      </div>
    </header>

    <main class="content">
      <!-- 1. API 키 설정 -->
      <section class="card">
        <h2>1. Google Gemini API 설정</h2>
        <p class="description">
          구글 AI Studio에서 무료로 발급받은 Gemini API 키를 입력해 주세요. 
          <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer">API 키 발급받기 &rarr;</a>
        </p>
        <div class="form-group">
          <label for="apiKey">Gemini API Key</label>
          <div class="input-with-button">
            <input type="password" id="apiKey" placeholder="AIzaSy..." autocomplete="off">
            <button type="button" id="toggleApiKeyBtn" class="btn btn-outline" title="키 표시/숨김">표시</button>
            <button type="button" id="testApiKeyBtn" class="btn btn-secondary">API 키 검증</button>
          </div>
          <span id="apiKeyStatus" class="status-hint"></span>
        </div>

        <div class="form-group">
          <label for="modelSelect">사용할 Gemini 모델</label>
          <select id="modelSelect">
            <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite (추천 / 기본)</option>
            <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite</option>
            <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite</option>
            <option value="custom">직접 입력 (Custom)...</option>
          </select>
          <input type="text" id="customModelInput" placeholder="모델명 직접 입력 (예: gemini-3.5-flash-lite)" style="display: none; margin-top: 6px;">
        </div>
      </section>

      <!-- 2. 언어 설정 -->
      <section class="card">
        <h2>2. 언어 설정</h2>
        
        <div class="form-group">
          <label class="group-title">
            소스 언어 후보 A (최대 2개 선택)
            <span class="help-badge">AI가 둘 중 어떤 언어인지 자동 판단</span>
          </label>
          <p class="description">드래그한 문장이 어떤 언어인지 판별할 후보 언어를 최대 2개까지 선택하세요.</p>
          <div id="sourceLangList" class="checkbox-grid">
            <!-- JavaScript로 동적 렌더링 -->
          </div>
          <span id="sourceLangWarning" class="warning-hint"></span>
        </div>

        <hr class="divider">

        <div class="form-group">
          <label for="targetLangSelect" class="group-title">
            결과 언어 B (1개 선택)
            <span class="help-badge">번역 및 설명 출력 언어</span>
          </label>
          <p class="description">최종 번역 결과 및 검토 조언을 전달받을 언어를 선택하세요.</p>
          <select id="targetLangSelect">
            <!-- JavaScript로 동적 렌더링 -->
          </select>
        </div>
      </section>

      <!-- 저장 버튼 & 알림 -->
      <div class="action-footer">
        <button id="saveBtn" class="btn btn-primary">설정 저장</button>
        <span id="saveStatus" class="save-toast"></span>
      </div>
    </main>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
